<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French ASR Leaderboard</title>
<meta name="description" content="Word and character error rates of open speech recognition models, by Linagora Labs.">
<style>
  /* Light theme only for now. */
  :root { color-scheme: light; --bg: #fbfbfa; --surface: #fff; --text: #1d1d1b; --muted: #6b6a66; --line: #e6e4df; --accent: #1f6f78; }
  /* Rank colors of each column (same as our other leaderboards). */
  .first { background: #5dade2; } .second { background: #82e0aa; }
  .second-last { background: #fdcb6e; } .last { background: #e74c3c; }
  td.first, td.second, td.second-last, td.last { color: #1d1d1b; }

  html { overflow-y: scroll; }  /* no layout shift between the tabs */
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  a { color: var(--accent); }
  main { max-width: 1680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .muted { color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 24px; margin: 24px 0 12px; align-items: center; }
  select, button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; margin-bottom: 12px; }
  .swatch { display: inline-block; width: 12px; height: 12px; margin-right: 5px; border-radius: 2px; vertical-align: -1px; }
  .scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { font-size: 13px; vertical-align: bottom; }
  th:nth-child(-n+2), td:nth-child(-n+2), .left { text-align: left; }
  td.avg { font-weight: 700; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover, th[aria-sort="ascending"] { color: var(--accent); }
  small { font-size: 11px; opacity: .75; }
  .notes { margin-top: 20px; font-size: 14px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px 24px; align-items: center; margin-top: 24px; border-bottom: 1px solid var(--line); }
  .tabs a { padding: 8px 2px; margin-bottom: -1px; color: var(--muted); text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; }
  .tabs a[aria-current="page"] { color: var(--accent); border-color: var(--accent); }
  .tabs label { margin-left: auto; }
  .intro { margin: 16px 0 0; }
  #tab-testsets .scroll { margin-top: 24px; }
  .hist rect { fill: var(--accent); }
  .hist text { fill: var(--muted); font-size: 10px; }
</style>
</head>
<body>
<main>
  <h1>French ASR Leaderboard</h1>
  <div class="muted" id="meta"></div>
  <p class="intro">Transcription errors of open-weight speech recognition models on French test sets.
    Only models whose weights are publicly available are evaluated.</p>

  <nav class="tabs">
    <a href="#">Leaderboard</a> <a href="#test-sets">Test sets</a>
    <label>Language <select id="language"></select></label>
  </nav>

  <section id="tab-board">
  <div class="controls">
    <span id="metric"><button data-v="wer" aria-pressed="true">WER</button> <button data-v="cer">CER</button></span>
    <span id="norm"><button data-v="1" aria-pressed="true" title="Lowercase, punctuation removed">Normalized</button> <button data-v="0" title="Case and punctuation count as errors">Case &amp; punct.</button></span>
    <span id="datasets"></span>
  </div>
  <div class="legend">
    <span><span class="swatch first"></span>1st</span> <span><span class="swatch second"></span>2nd</span>
    <span><span class="swatch second-last"></span>Second to last</span> <span><span class="swatch last"></span>Last</span>
  </div>

  <div class="scroll"><table id="board"></table></div>
  <div class="notes muted" id="notes"></div>
  </section>

  <section id="tab-testsets" hidden>
  <div class="scroll"><table id="testsets"></table></div>
  </section>
</main>

<script>
const DATA = /*__DATA__*/null;
const LANGUAGES = { fr: "French", en: "English", ar: "Arabic", de: "German", es: "Spanish", it: "Italian" };
// sort: id of the test set whose column orders the table, null for the average.
const state = { language: "fr", metric: "wer", norm: true, selected: new Set(), sort: null };

const f1 = v => v.toFixed(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const metricKey = () => state.metric + (state.norm ? "_nocasepunc" : "");
const datasetsOf = lang => DATA.datasets.filter(d => d.language === lang);
const modelsOf = lang => DATA.models.filter(m => datasetsOf(lang).some(d => d.id in m.scores));
const result = (m, d) => (m.scores[d.id] || {})[metricKey()];  // {wer, sub, del, ins, ci95} or undefined
// Model info columns.
const params = n => n >= 1e9 ? `${(n / 1e9).toFixed(n < 1e10 ? 1 : 0)}B` : `${Math.round(n / 1e6)}M`;
const licenseText = l => ({ "apache-2.0": "Apache-2.0", gemma: "Gemma" })[l] || l.toUpperCase();
const languagesText = l => l && l.length <= 5 ? l.join(", ") : "multi";
const halfWidth = r => r && r.ci95 ? (r.ci95[1] - r.ci95[0]) / 2 : null;
// Test sets without casing/punctuation in their references (MLS, SUMM-RE) have no
// "Case & punct." score: they are left out of that mode.
const scored = d => DATA.models.some(m => result(m, d));

// All the test sets of a language are selected by default.
function selectLanguage(lang) {
  state.language = lang;
  state.selected = new Set(datasetsOf(lang).map(d => d.id));
  document.getElementById("datasets").innerHTML = datasetsOf(lang).map(d =>
    `<button data-id="${esc(d.id)}" aria-pressed="${state.selected.has(d.id)}">${esc(d.name)}</button>`).join(" ");
  renderTestSets();
  render();
}

// Durations histogram as an inline SVG. Same x scale (seconds) for every test set,
// y scale relative to the test set's highest bin.
const ticks = max => Array.from({ length: Math.floor(max / 10) + 1 }, (_, i) => i * 10);  // 0, 10, 20... s
function histogramSvg(counts, bins) {
  const w = 12, h = 48, top = Math.max(...counts), step = DATA.histogram_bin;
  const bars = counts.map((c, i) => `<rect x="${i * w}" y="${h - h * c / top}" width="${w - 1}" height="${h * c / top}">` +
    `<title>${i * step}–${(i + 1) * step} s: ${c} utterances</title></rect>`).join("");
  return `<svg class="hist" width="${bins * w}" height="${h + 12}" role="img" aria-label="Durations histogram">${bars}` +
    ticks(bins * step).map(t => `<text x="${t / step * w}" y="${h + 11}" text-anchor="${t ? t === bins * step ? "end" : "middle" : "start"}">` +
      `${t}${t === bins * step ? " s" : ""}</text>`).join("") + "</svg>";
}

function renderTestSets() {
  const datasets = datasetsOf(state.language);
  const bins = Math.max(0, ...datasets.map(d => (d.histogram || []).length));
  const head = `<tr><th>Test set</th><th>Type</th><th>Utterances</th><th>Duration</th><th>Mean length</th><th>Median length</th><th>Length distribution</th></tr>`;
  const body = datasets.map(d => `<tr><td>${esc(d.name)}</td><td>${esc(d.domain)}</td><td>${d.utterances}</td>` +
    `<td>${d.hours != null ? f1(d.hours) + " h" : "—"}</td><td>${d.mean_seconds != null ? f1(d.mean_seconds) + " s" : "—"}</td>` +
    `<td>${d.median_seconds != null ? f1(d.median_seconds) + " s" : "—"}</td>` +
    `<td>${d.histogram ? histogramSvg(d.histogram, bins) : "—"}</td></tr>`).join("");
  document.getElementById("testsets").innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
}

// Mean of the per-test-set scores; its ± combines the per-set half-widths as independent errors.
function average(m, datasets) {
  const results = datasets.map(d => result(m, d));
  if (!datasets.length || results.some(r => !r)) return null;
  const hw = results.map(halfWidth);
  return {
    wer: results.reduce((a, r) => a + r.wer, 0) / results.length,
    pm: hw.every(h => h != null) ? Math.sqrt(hw.reduce((a, h) => a + h * h, 0)) / hw.length : null,
  };
}

// Mean over the test sets of each model's rank (1 = best score of the column). Ranked
// among the models that have an average, so that all compare on the same test sets;
// displayed-equal scores share a rank.
function averageRanks(models, datasets) {
  const shown = v => Math.round(v * 10) / 10;
  const ranks = new Map(models.map(m => [m, 0]));
  for (const d of datasets) {
    const scores = models.map(m => shown(result(m, d).wer));
    models.forEach((m, i) => ranks.set(m, ranks.get(m) + 1 + scores.filter(v => v < scores[i]).length));
  }
  models.forEach(m => ranks.set(m, ranks.get(m) / datasets.length));
  return ranks;
}

// Class of a score by its rank in its column: first, second, second-last, last.
// Ranks are over the distinct displayed values: ties share a color and the next value
// still gets the following one (two last -> both red, the value above them orange).
function rankClass(value, values) {
  if (value == null || values.length < 4) return "";
  const shown = v => Math.round(v * 10) / 10;
  const sorted = [...new Set(values.map(shown))].sort((a, b) => a - b);
  const i = sorted.indexOf(shown(value)), n = sorted.length;
  return i === 0 ? "first" : i === 1 ? "second" : i === n - 1 ? "last" : i === n - 2 ? "second-last" : "";
}

function cell(value, pm, cls, title) {
  if (value == null) return `<td class="muted">—</td>`;
  return `<td class="${cls}" title="${esc(title)}">${f1(value)}${pm != null ? ` <small>±${f1(pm)}</small>` : ""}</td>`;
}

function render() {
  const datasets = datasetsOf(state.language).filter(d => state.selected.has(d.id) && scored(d));
  for (const d of datasetsOf(state.language)) {
    const button = document.querySelector(`#datasets button[data-id="${d.id}"]`);
    button.disabled = !scored(d);
    button.title = scored(d) ? d.domain : "No score in this mode (references without case and punctuation)";
  }
  const sortBy = datasets.find(d => d.id === state.sort);  // undefined: sort by the average or the rank
  const byRank = state.sort === "rank";
  const byInfo = { params: m => m.params, rtfx: m => m.rtfx != null ? -m.rtfx : null }[state.sort];  // RTFx: fastest first
  const sortedId = byRank || byInfo ? state.sort : sortBy ? sortBy.id : "";
  const rows = modelsOf(state.language).map(m => ({ m, avg: average(m, datasets) }));
  const ranks = averageRanks(rows.filter(r => r.avg).map(r => r.m), datasets);
  for (const r of rows) {
    r.rank = ranks.get(r.m);
    r.key = byInfo ? byInfo(r.m) : byRank ? r.rank : sortBy ? (result(r.m, sortBy) || {}).wer : r.avg && r.avg.wer;
  }
  // Models without a score in the sorted column go last, by name.
  rows.sort((a, b) => (a.key ?? Infinity) - (b.key ?? Infinity) || a.m.model.localeCompare(b.m.model));
  const column = get => rows.map(get).filter(v => v != null);
  const avgValues = column(r => r.avg && r.avg.wer);
  const rankValues = column(r => r.rank);
  const values = Object.fromEntries(datasets.map(d => [d.id, column(r => (result(r.m, d) || {}).wer)]));

  const th = (id, label, sub, title) => {
    const sorted = id === sortedId;
    return `<th data-sort="${esc(id)}" class="sortable" aria-sort="${sorted ? "ascending" : "none"}" title="${esc(title)}">` +
      `${sorted ? "▲ " : ""}${label}<br><small>${sub}</small></th>`;
  };
  const head = `<tr><th>#</th><th>Model</th>${th("", "Average", `${datasets.length} test sets`, "Sort by the average")}` +
    th("rank", "Avg rank", `${datasets.length} test sets`, "Sort by the average rank") +
    datasets.map(d => th(d.id, esc(d.name), d.hours != null ? f1(d.hours) + " h" : "", `${d.domain}. Sort by this test set`)).join("") +
    th("rtfx", "RTFx", "speed", "Seconds of audio transcribed per second of computation (higher is faster). Sort by speed") +
    th("params", "Size", "parameters", "Number of parameters. Sort by size") +
    `<th class="left">License</th><th class="left" title="Languages supported according to the model card">Languages</th></tr>`;
  let rank = 0;
  const body = rows.map(({ m, avg, rank: avgRank, key }) => {
    const name = m.url ? `<a href="${esc(m.url)}">${esc(m.model)}</a>` : esc(m.model);
    const cells = datasets.map(d => {
      const r = result(m, d);
      if (!r) return cell(null);
      const title = [
        r.ci95 && `95% CI: ${f1(r.ci95[0])} – ${f1(r.ci95[1])}`,
        `Substitutions: ${f1(r.sub)}`, `Deletions: ${f1(r.del)}`, `Insertions: ${f1(r.ins)}`,
        `Utterances: ${m.scores[d.id].n}`,
      ].filter(Boolean).join("\n");
      return cell(r.wer, halfWidth(r), rankClass(r.wer, values[d.id]), title);
    }).join("");
    const avgCell = avg ? cell(avg.wer, avg.pm, "avg " + rankClass(avg.wer, avgValues), "Mean over the selected test sets")
                        : `<td class="muted" title="Not evaluated on all the selected test sets">—</td>`;
    const rankCell = avgRank != null ? cell(avgRank, null, rankClass(avgRank, rankValues), "Mean of the ranks over the selected test sets")
                                     : `<td class="muted">—</td>`;
    const info = (m.rtfx != null ? `<td title="${esc(m.hardware ? `On ${m.hardware}` : "")}">${Math.round(m.rtfx)}×</td>` : `<td class="muted" title="Not measured yet">—</td>`) +
      `<td>${m.params ? params(m.params) : "—"}</td><td class="left">${esc(m.license ? licenseText(m.license) : "—")}</td>` +
      `<td class="left" title="${esc(m.languages ? m.languages.join(" ") : "Not listed in the model card")}">${esc(languagesText(m.languages))}</td>`;
    return `<tr><td>${key != null ? ++rank : ""}</td><td>${name}<br><small>${esc([m.variant, m.backend].filter(Boolean).join(" · "))}</small></td>${avgCell}${rankCell}${cells}${info}</tr>`;
  }).join("");
  document.getElementById("board").innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
}

// Controls
const languages = [...new Set(DATA.datasets.map(d => d.language))];
const languageSelect = document.getElementById("language");
languageSelect.innerHTML = languages.map(l => `<option value="${l}">${LANGUAGES[l] || l}</option>`).join("");
languageSelect.value = languages.includes("fr") ? "fr" : languages[0];
languageSelect.onchange = () => selectLanguage(languageSelect.value);
languageSelect.parentElement.hidden = languages.length < 2;  // only French for now
for (const [id, apply] of [["metric", v => state.metric = v], ["norm", v => state.norm = v === "1"]]) {
  document.getElementById(id).onclick = e => {
    if (!e.target.dataset.v) return;
    document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute("aria-pressed", b === e.target));
    apply(e.target.dataset.v);
    render();
  };
}
document.getElementById("board").onclick = e => {
  const header = e.target.closest("th[data-sort]");
  if (!header) return;
  state.sort = header.dataset.sort || null;
  render();
};
document.getElementById("datasets").onclick = e => {
  const id = e.target.dataset.id;
  if (!id) return;
  state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
  e.target.setAttribute("aria-pressed", state.selected.has(id));
  render();
};

// Texts
const updated = DATA.results_updated && new Date(DATA.results_updated).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
document.getElementById("meta").innerHTML = `${updated ? `Updated on ${updated} · ` : ""}<a href="${DATA.repo}">${DATA.repo.replace("https://", "")}</a>`;
document.getElementById("notes").innerHTML = `
  <p><b>WER</b> (word error rate) and <b>CER</b> (character error rate), in %: lower is better. Click a column header to sort by that test set, or by the average.</p>
  <p><b>Capped at 100% per segment</b>: the errors of each segment count at most as many as the words (or characters) of its reference, so that one or two hallucinated segments cannot inflate a score on their own. The excess is removed from the insertions.</p>
  <p><b>Average</b>: mean of the scores over the selected test sets. A model not evaluated on all the selected test sets gets no average (—): unselect a test set to compare it.</p>
  <p><b>Avg rank</b>: mean of the model's rank on each selected test set (1 = best), among the models that have an average. Unlike the average, a test set with high error rates does not weigh more than the others.</p>
  <p><b>±</b>: half-width of the 95% confidence interval, by bootstrap over the utterances of each test set (hover a score for the exact interval and the error breakdown).</p>
  <p><b>Normalized</b> scores ignore case and punctuation; <b>Case &amp; punct.</b> counts them as errors; it leaves out the test sets whose references have no case and punctuation. Segments of at most 30 s.</p>
  <p><b>Size</b>, <b>License</b> and <b>Languages</b> (up to 5, "multi" beyond: hover for the list) come from the model cards. <b>RTFx</b>: seconds of audio transcribed per second of computation, on long recordings (hover for the hardware); higher is faster.</p>
  <p>Results and configuration: <a href="${DATA.repo}/tree/main/benchmarks/sota">benchmarks/sota</a>. Raw data: <a href="leaderboard.json">leaderboard.json</a>.</p>`;

// Tabs: the URL hash (#test-sets) picks the tab, so that it can be linked.
function showTab() {
  const testsets = location.hash === "#test-sets";
  document.getElementById("tab-board").hidden = testsets;
  document.getElementById("tab-testsets").hidden = !testsets;
  document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-current", (a.hash === "#test-sets") === testsets ? "page" : "false"));
}
window.onhashchange = showTab;
showTab();

selectLanguage(languageSelect.value);
</script>
</body>
</html>
