[project]
name = "asr_benchmark"
version = "0.1.1"
description = "Package for benching french ASR models. It supports Whisper, NeMo, vLLM and Transformers. It can compute WER, RTF and measure hardware usage."
authors = [
    { name = "Audran Bert", email = "abert@linagora.com" },
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyyaml",
    "torch",
    "torchcodec",
    "librosa>=0.10.1",
    "websockets>=12.0",
    "tqdm>=4.66.2",
    "torchaudio>=2.3.1",
    "jiwer>=3.0.4,<4.0.0",
    "num2words",
    "matplotlib>=3.9",
    "psutil",
    "py3nvml",
    "ssak @ git+https://github.com/linagora-labs/ssak",
    "soxbindings"
]

[project.optional-dependencies]
whisper = [
    "faster-whisper @ git+https://github.com/linto-ai/faster-whisper",
    "ctranslate2>=4.4.0",
]
nemo = [
    "nemo_toolkit[asr]>=2.5.0",
]
moss = [
    # The model's remote code imports transformers.utils.torch_compilable_check,
    # which only exists in transformers 5.x.
    "transformers>=5.0.0",
    "accelerate",
    # gemma-3n has a vision tower built through timm's TimmWrapperModel, so
    # transformers refuses to instantiate the model without timm (which itself
    # needs torchvision). The gemma3n backend shares this transformers-5.x env;
    # run_config.sh's pass 1 uses --extra moss --extra voxtral.
    "timm",
    "torchvision",
]
voxtral = [
    # VoxtralProcessor.apply_transcription_request() is gated behind a
    # mistral-common backend check in transformers, so the tokenizer library is
    # required even though the processor itself loads without it.
    "transformers>=5.0.0",
    "accelerate",
    "mistral-common",
]
visu = [
    "pandas",
    "ipykernel",
    "matplotlib",
    "seaborn",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asr_benchmark*"]

[tool.uv]
conflicts = [
    [
        { extra = "whisper" },
        { extra = "nemo" },
        { extra = "moss" },
    ],
    # voxtral needs transformers 5.x like moss, so the two can share an
    # environment; only whisper and nemo are incompatible with it.
    [
        { extra = "whisper" },
        { extra = "nemo" },
        { extra = "voxtral" },
    ],
]

# PyPI's torch/torchaudio wheels for Linux aarch64 are CPU-only builds, so on
# ARM machines (e.g. the DGX Spark, GB10) you get "Torch not compiled with CUDA
# enabled" and torchcodec fails to load libc10_cuda.so. The CUDA ARM builds are
# only published on download.pytorch.org, so redirect these three there on
# aarch64. x86_64 is untouched: PyPI's wheels are already CUDA-enabled there.
# NB: torch must stay a direct dependency above -- [tool.uv.sources] only
# applies to direct dependencies, not ones pulled in transitively.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchcodec = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

# CTranslate2 (a faster-whisper dependency) ships CUDA-enabled wheels for x86_64
# only; its aarch64 PyPI wheel is CPU-only, so on ARM machines (e.g. the DGX Spark)
# faster-whisper fails with "This CTranslate2 package was not compiled with CUDA
# support". There is no public CUDA aarch64 wheel -- it has to be built locally
# (see CTRANSLATE2_BUILD.md). We deliberately do NOT pin a machine-local wheel path
# here: an absolute path is not portable and, because uv resolves every supported
# platform, a `path` source must exist on disk even on machines whose marker
# excludes it -- which breaks `uv` on every host that lacks that exact file.
# Instead, on an ARM host that needs CUDA faster-whisper, point uv at the locally
# built wheel at sync time (no repo change needed), e.g.:
#     UV_FIND_LINKS=/path/to/your/wheels uv sync --extra whisper
# or install it over the CPU wheel afterwards:
#     uv pip install --reinstall /path/to/ctranslate2-*-linux_aarch64.whl
