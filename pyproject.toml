[project]
name = "asr_benchmark"
version = "0.1.1"
description = "Package for benching french ASR models. It supports Whisper, NeMo, vLLM and Transformers. It can compute WER, RTF and measure hardware usage."
authors = [
    { name = "Audran Bert", email = "abert@linagora.com" },
]
requires-python = ">=3.10,<3.13"
# Core: only what every benchmark run imports (benchmarker.py, benchmark_manager,
# utils/benchmark, interfaces.py) plus the third-party modules ssak imports at the
# top of ssak.utils.{wer,monitoring,audio,text} -- ssak itself declares no
# dependencies. Everything backend- or tool-specific lives in an extra below.
dependencies = [
    "pyyaml",
    "numpy",
    "torch",
    "torchaudio>=2.3.1",
    # torchaudio >= 2.9 delegates audio I/O to torchcodec. torchcodec declares no torch
    # requirement but each release is built against one torch version (0.N <-> 2.N):
    # unpinned, uv picks the latest one, which fails to load (missing libnvrtc) with
    # the torch 2.10 resolved on x86_64. Keep it matched with torch there.
    "torchcodec==0.10.*; platform_machine != 'aarch64'",
    "torchcodec; platform_machine == 'aarch64'",
    "librosa>=0.10.1",
    # utils/benchmark.py writes wav files (also a librosa dependency).
    "soundfile",
    "soxbindings",
    "tqdm>=4.66.2",
    "requests",
    "matplotlib>=3.9",
    "jiwer>=3.0.4,<4.0.0",
    "num2words",
    "psutil",
    "py3nvml",
    "ssak @ git+https://github.com/linagora-labs/ssak",
]

[project.optional-dependencies]
# ---- Backends -------------------------------------------------------------
whisper = [
    "faster-whisper @ git+https://github.com/linto-ai/faster-whisper",
    "ctranslate2>=4.4.0",
]
openai-whisper = [
    # backend "openai" (interfaces_whisper.OpenAIModel -> `import whisper`).
    "openai-whisper",
]
nemo = [
    # nvidia/nemotron-3.5-asr-streaming-0.6b (EncDecRNNTBPEModelWithPrompt) needs >= 3.0.0.
    "nemo_toolkit[asr]>=2.5.0",
    # CTC beam search with a KenLM language model (NemoModel, `lm` config key).
    "pyctcdecode",
]
transformers = [
    # backends "transformers", "transformers-whisper", "transformers-facebook",
    # "transformers-bofenghuang", "qwen3-omni". Unpinned so it can share the nemo env (transformers 4.x) or the
    # transformers-5.x env. "transformers-voxtral-realtime" needs transformers 5.x.
    "transformers",
    "accelerate",
    # Wav2Vec2ProcessorWithLM (transformers-bofenghuang) decodes with pyctcdecode.
    "pyctcdecode",
]
moss = [
    # The model's remote code imports transformers.utils.torch_compilable_check,
    # which only exists in transformers 5.x.
    "transformers>=5.0.0",
    "accelerate",
]
gemma3n = [
    # gemma-3n has a vision tower built through timm's TimmWrapperModel, so
    # transformers refuses to instantiate the model without timm (which itself
    # needs torchvision). Shares the transformers-5.x env with moss/voxtral.
    "transformers>=5.0.0",
    "accelerate",
    "timm",
    "torchvision",
]
voxtral = [
    # VoxtralProcessor.apply_transcription_request() is gated behind a
    # mistral-common backend check in transformers, so the tokenizer library is
    # required even though the processor itself loads without it.
    "transformers>=5.0.0",
    "accelerate",
    "mistral-common",
]
qwen-asr = [
    # Qwen/Qwen3-ASR-1.7B-hf uses checkpoint model type 'qwen3_asr', which is only
    # recognised from transformers 5.13 onwards. Shares the transformers-5.x env, so
    # it can be combined with moss/voxtral in a single pass.
    "transformers>=5.13.0",
    "accelerate",
]
vibevoice = [
    # microsoft/VibeVoice-ASR-HF (VibeVoiceAsrForConditionalGeneration) landed in
    # transformers 5.3. Shares the transformers-5.x env with moss/voxtral/qwen-asr.
    "transformers>=5.3.0",
    "accelerate",
]
linto = [
    # backends "linto-stt*" (websocket streaming to a LinTO-STT container).
    "websockets>=12.0",
]
# The "vllm" backend only talks HTTP to a `vllm serve` process (core `requests`);
# vLLM itself is expected in its own env/container (see `vllm_command`).

# ---- Options --------------------------------------------------------------
vad = [
    # `vad: auditok` / `vad: silero` in configs (ssak.utils.vad imports lazily).
    # `vad: pyannote` additionally needs pyannote.audio, not installed here.
    "auditok",
    "onnxruntime",
]

# ---- Analysis & tools -----------------------------------------------------
visu = [
    "pandas",
    "seaborn",
    "ipykernel",
]
tools = [
    # tools/*.py standalone scripts (add_silence, concat_audios, subsample_data,
    # generate_plots).
    "pydub",
    "scikit-learn",
    "pandas",
    "seaborn",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asr_benchmark*"]

[tool.uv]
conflicts = [
    [
        { extra = "whisper" },
        { extra = "nemo" },
        { extra = "moss" },
    ],
    # voxtral needs transformers 5.x like moss, so the two can share an
    # environment; only whisper and nemo are incompatible with it.
    [
        { extra = "whisper" },
        { extra = "nemo" },
        { extra = "voxtral" },
    ],
    # qwen-asr also needs transformers 5.x, so it shares that env with moss/voxtral
    # and only conflicts with whisper and nemo.
    [
        { extra = "whisper" },
        { extra = "nemo" },
        { extra = "qwen-asr" },
    ],
    [
        { extra = "whisper" },
        { extra = "nemo" },
        { extra = "vibevoice" },
    ],
    [
        { extra = "whisper" },
        { extra = "nemo" },
        { extra = "gemma3n" },
    ],
]

# PyPI's torch/torchaudio wheels for Linux aarch64 are CPU-only builds, so on
# ARM machines (e.g. the DGX Spark, GB10) you get "Torch not compiled with CUDA
# enabled" and torchcodec fails to load libc10_cuda.so. The CUDA ARM builds are
# only published on download.pytorch.org, so redirect these three there on
# aarch64. x86_64 is untouched: PyPI's wheels are already CUDA-enabled there.
# NB: torch must stay a direct dependency above -- [tool.uv.sources] only
# applies to direct dependencies, not ones pulled in transitively.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchcodec = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

# CTranslate2 (a faster-whisper dependency) ships CUDA-enabled wheels for x86_64
# only; its aarch64 PyPI wheel is CPU-only, so on ARM machines (e.g. the DGX Spark)
# faster-whisper fails with "This CTranslate2 package was not compiled with CUDA
# support". There is no public CUDA aarch64 wheel -- it has to be built locally
# (see CTRANSLATE2_BUILD.md). We deliberately do NOT pin a machine-local wheel path
# here: an absolute path is not portable and, because uv resolves every supported
# platform, a `path` source must exist on disk even on machines whose marker
# excludes it -- which breaks `uv` on every host that lacks that exact file.
# Instead, on an ARM host that needs CUDA faster-whisper, point uv at the locally
# built wheel at sync time (no repo change needed), e.g.:
#     UV_FIND_LINKS=/path/to/your/wheels uv sync --extra whisper
# or install it over the CPU wheel afterwards:
#     uv pip install --reinstall /path/to/ctranslate2-*-linux_aarch64.whl
