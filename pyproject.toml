[project]
name = "asr_benchmark"
version = "0.1.1"
description = "Package for benching french ASR models. It supports Whisper, NeMo, vLLM and Transformers. It can compute WER, RTF and measure hardware usage."
authors = [
    { name = "Audran Bert", email = "abert@linagora.com" },
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyyaml",
    "torchcodec",
    "librosa>=0.10.1",
    "websockets>=12.0",
    "tqdm>=4.66.2",
    "torchaudio>=2.3.1",
    "jiwer>=3.0.4,<4.0.0",
    "num2words",
    "psutil",
    "py3nvml",
    "ssak @ git+https://github.com/linagora-labs/ssak",
    "soxbindings"
]

[project.optional-dependencies]
whisper = [
    "faster-whisper @ git+https://github.com/linto-ai/faster-whisper",
    "ctranslate2>=4.4.0",
]
nemo = [
    "nemo_toolkit[asr]>=2.5.0",
]
visu = [
    "pandas",
    "ipykernel",
    "matplotlib",
    "seaborn",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asr_benchmark*"]

[tool.uv]
conflicts = [
    [
        { extra = "whisper" },
        { extra = "nemo" },
    ],
]
