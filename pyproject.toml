[project]
name = "asr_benchmark"
version = "0.1.1"
description = "Package for benching french ASR models. It supports Whisper, NeMo, vLLM and Transformers. It can compute WER, RTF and measure hardware usage."
authors = [
    { name = "Audran Bert", email = "abert@linagora.com" },
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyyaml",
    "torch",
    "torchcodec",
    "librosa>=0.10.1",
    "websockets>=12.0",
    "tqdm>=4.66.2",
    "torchaudio>=2.3.1",
    "jiwer>=3.0.4,<4.0.0",
    "num2words",
    "matplotlib<=3.7.4",
    "psutil",
    "py3nvml",
    "ssak @ git+https://github.com/linagora-labs/ssak",
    "soxbindings"
]

[project.optional-dependencies]
whisper = [
    "faster-whisper @ git+https://github.com/linto-ai/faster-whisper",
    "ctranslate2>=4.4.0",
]
nemo = [
    "nemo_toolkit[asr]>=2.5.0",
]
moss = [
    # The model's remote code imports transformers.utils.torch_compilable_check,
    # which only exists in transformers 5.x.
    "transformers>=5.0.0",
    "accelerate",
]
voxtral = [
    # VoxtralProcessor.apply_transcription_request() is gated behind a
    # mistral-common backend check in transformers, so the tokenizer library is
    # required even though the processor itself loads without it.
    "transformers>=5.0.0",
    "accelerate",
    "mistral-common",
]
visu = [
    "pandas",
    "ipykernel",
    "matplotlib",
    "seaborn",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asr_benchmark*"]

[tool.uv]
conflicts = [
    [
        { extra = "whisper" },
        { extra = "nemo" },
        { extra = "moss" },
    ],
    # voxtral needs transformers 5.x like moss, so the two can share an
    # environment; only whisper and nemo are incompatible with it.
    [
        { extra = "whisper" },
        { extra = "nemo" },
        { extra = "voxtral" },
    ],
]

# PyPI's torch/torchaudio wheels for Linux aarch64 are CPU-only builds, so on
# ARM machines (e.g. the DGX Spark, GB10) you get "Torch not compiled with CUDA
# enabled" and torchcodec fails to load libc10_cuda.so. The CUDA ARM builds are
# only published on download.pytorch.org, so redirect these three there on
# aarch64. x86_64 is untouched: PyPI's wheels are already CUDA-enabled there.
# NB: torch must stay a direct dependency above -- [tool.uv.sources] only
# applies to direct dependencies, not ones pulled in transitively.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchcodec = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

# CTranslate2 publishes CUDA-enabled wheels for x86_64 only; its aarch64 wheel is
# CPU-only, so faster-whisper dies with "This CTranslate2 package was not compiled
# with CUDA support" on the DGX Spark. This is a local build of v4.8.1 for
# sm_121 (see CTRANSLATE2_BUILD.md). x86_64 keeps using the PyPI wheel.
ctranslate2 = [{ path = "/home/jlouradour/wheels/ctranslate2-4.8.1-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_full_version >= '3.12' and python_full_version < '3.13'" }]
