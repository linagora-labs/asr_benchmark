input_manifest: benchmarks/sota/manifest.jsonl
output_folder: benchmarks/sota/results
compute_rtf: False
plot_monitoring: False
skip_errors: False
save_alignments: True
save_predictions: False

# Backends need separate environments: on the DGX, run one part at a time with
# tools/run_sota_dgx.sh <part> (already-benched models are skipped).
# Prompts: chosen on 120 segments (logs/prompt_test on the DGX), WER in comments.

benchmarks:
  # Streaming model, transcribed offline
  - backend: transformers-voxtral-realtime
    model: mistralai/Voxtral-Mini-4B-Realtime-2602
    language: fr
  # --- Luciole-Audio (local NeMo SALM checkpoints): tools/run_sota_dgx.sh salm --
  - backend: vllm
    model: /home/abert/models/salm/Luciole-1B/luciole_v4_singlephase/hf_checkpoints/step_100000
    served_model_name: linagora/Luciole-Audio-1B-v4-singlephase-step100k
    port: 8111
    endpoint: chat
    audio_placeholder: "<|audio|>"
    concurrency: 16
  - backend: vllm
    model: /home/abert/models/salm/Luciole-8B/luciole8b_v4_singlephase/hf_checkpoints/step_100000
    served_model_name: linagora/Luciole-Audio-8B-v4-singlephase-step100k
    port: 8112
    endpoint: chat
    audio_placeholder: "<|audio|>"
    concurrency: 16
  # --- IBM Granite Speech -----------------------------------------------------
  # 3.3: vLLM's default prompt (20.1); translated into French, it is copied into the
  # output (41.3). The audio LoRA only applies to requests naming it (request_model).
  # --max-model-len caps looping generations.
  - backend: vllm
    model: ibm-granite/granite-speech-3.3-8b
    port: 8113
    language: fr
    extra_args: --max-model-len 2048 --enable-lora --max-lora-rank 64 --lora-modules speech=ibm-granite/granite-speech-3.3-8b
    request_model: speech
    concurrency: 16
  # 4.1: model card's punctuated-ASR prompt translated into French (22.0, English 25.0)
  - backend: vllm
    model: ibm-granite/granite-speech-4.1-2b
    port: 8114
    endpoint: chat
    prompt: <|audio|>transcris la parole française avec la ponctuation et les majuscules appropriées.
    extra_args: --max-model-len 2048
    concurrency: 16
  # --- Cohere Transcribe (gated) ------------------------------------------------
  - backend: vllm
    model: CohereLabs/cohere-transcribe-03-2026
    trust_remote_code: true
    port: 8115
    language: fr
    concurrency: 16
  # --- Mistral Voxtral ------------------------------------------------------------
  - backend: transformers-voxtral
    model: mistralai/Voxtral-Small-24B-2507
    dtype: bfloat16
    language: fr
  - backend: transformers-voxtral
    model: mistralai/Voxtral-Mini-3B-2507
    dtype: bfloat16
    language: fr
  # --- transformers 4.57 (part transformers4) -------------------------------------
  # ARK: the model card's prompt translates into English (31.0 here, 42.6 in English)
  - backend: ark-asr
    model: Edge0/ARK-ASR-3B
    prompt: Transcris cet audio en français.
    batch_size: 8
  # stt-1b-en_fr (stt-2.6b-en is English only), streaming model transcribed offline
  - backend: kyutai-stt
    model: kyutai/stt-1b-en_fr-trfs
    batch_size: 8
  - backend: hojo-asr
    model: HojoAI/Hojo-ASR-Multi-V1
    batch_size: 8
  # --- MOSS-Transcribe-Diarize --------------------------------------------------
  # Model card's prompt translated into French (15.9, Chinese 17.2)
  - backend: moss
    model: OpenMOSS-Team/MOSS-Transcribe-Diarize
    dtype: bfloat16
    batch_size: 8
    prompt: "Transcris l’audio en texte français ; chaque segment commence par un horodatage de début et le numéro du locuteur ([S01], [S02], [S03]…), suivi du contenu parlé, et se termine par un horodatage de fin."
  # --- Other audio LLMs -------------------------------------------------------------
  - backend: gemma3n
    model: google/gemma-3n-e4b-it
    dtype: bfloat16
  - backend: qwen3-omni
    model: Qwen/Qwen3-Omni-30B-A3B-Instruct
    dtype: bfloat16
  - backend: qwen3-asr
    model: Qwen/Qwen3-ASR-1.7B-hf
    dtype: bfloat16
    max_new_tokens: 256
    language: fr
  # VibeVoice: no language setting.
  - backend: vibevoice-asr
    model: microsoft/VibeVoice-ASR-HF
    dtype: bfloat16
    batch_size: 8
  # --- NVIDIA -------------------------------------------------------------------------
  # Nemotron: streaming model transcribed offline, largest chunk (best WER)
  - backend: nemo
    model: nvidia/nemotron-3.5-asr-streaming-0.6b
    batch_size: 16
    language: fr
    chunk_ms: 1120
  # moondream post-trainings of parakeet-tdt-0.6b-v3 (transformers, no language setting)
  - backend: transformers-parakeet
    model:
    - moondream/parakeet-ultra
    - moondream/parakeet-redux
    batch_size: 16
  - backend: nemo
    model:
    - nvidia/canary-180m-flash
    - nvidia/canary-1b
    - nvidia/canary-1b-v2
    - nvidia/parakeet-tdt-0.6b-v3
    batch_size: 16
    language: fr
  - backend: nemo
    model:
    - nvidia/stt_fr_fastconformer_hybrid_large_pc
    - bofenghuang/stt_fr_fastconformer_hybrid_large
    - linagora/linto_stt_fr_fastconformer
    - linagora/linto_stt_fr_fastconformer_pc
    batch_size: 16
    decoder:
    - rnnt
  - backend: nemo
    model: linagora/linto_stt_fr_fastconformer_pc
    batch_size: 16
    decoder:
    - ctc
  # --- Whisper ------------------------------------------------------------------------
  # BuzzASR: whisper-large-v3 French fine-tune, decoding from its model card
  - backend: transformers-whisper
    model: BuzzASR/french
    generate_kwargs:
      no_repeat_ngram_size: 3
      repetition_penalty: 1.2
  - backend: faster-whisper
    model:
    - large-v3
    - large-v3-turbo
    precision: float16
