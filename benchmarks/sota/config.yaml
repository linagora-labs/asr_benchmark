input_manifest: benchmarks/sota/manifest.jsonl
output_folder: benchmarks/sota/results
compute_rtf: False
plot_monitoring: False
skip_errors: False
save_alignments: True
save_predictions: False

# The whisper, nemo and transformers-5.x (moss / voxtral / gemma3n / qwen3-omni /
# vibevoice) extras conflict in pyproject.toml, so this file is run in several
# passes, one per environment. Already-benched models are skipped; with
# skip_errors: False a pass aborts at the first backend it cannot import, set it
# to True to sweep:
#   uv run --extra moss --extra voxtral --extra vibevoice python benchmarker.py benchmarks/sota/config.yaml
#   uv run --extra nemo                 python benchmarker.py benchmarks/sota/config.yaml
#   uv run --extra whisper              python benchmarker.py benchmarks/sota/config.yaml

benchmarks:
  # https://huggingface.co/mistralai/Voxtral-Mini-4B-Realtime-2602#vllm-recommended
  - backend: transformers-voxtral-realtime
    model: mistralai/Voxtral-Mini-4B-Realtime-2602
    language: fr
  # --- Luciole-Audio (Linagora NeMo SALM: parakeet-tdt-0.6b-v3 + Luciole LLM) --
  # Local checkpoints (on the DGX), served by vLLM through the SALM plugin of the
  # NeMo fork (~/NeMo, branch luciole_speech): run with `tools/run_sota_dgx.sh salm`
  # (the vllm part skips them). No transcription interface in the plugin: chat
  # endpoint, default prompt with the audio after it (as in the model cards).
  - backend: vllm
    model: /home/abert/models/salm/Luciole-1B/luciole_v4_singlephase/hf_checkpoints/step_100000
    served_model_name: linagora/Luciole-Audio-1B-v4-singlephase-step100k
    port: 8111
    endpoint: chat
    audio_placeholder: "<|audio|>"
    concurrency: 16
  - backend: vllm
    model: /home/abert/models/salm/Luciole-8B/luciole8b_v4_singlephase/hf_checkpoints/step_100000
    served_model_name: linagora/Luciole-Audio-8B-v4-singlephase-step100k
    port: 8112
    endpoint: chat
    audio_placeholder: "<|audio|>"
    concurrency: 16
  # --- IBM Granite Speech 3.3 (conformer + granite-3.3-8b-instruct, ASR in en/fr/de/es/pt) --
  # vLLM's transcription prompt is the model card's ("can you transcribe the speech into
  # a written format?", no language). The audio LoRA of the repo only applies to the
  # requests that name it (request_model). --max-model-len 2048 (IBM's vLLM example)
  # caps the generation: without it, looping outputs run until the request timeout.
  - backend: vllm
    model: ibm-granite/granite-speech-3.3-8b
    port: 8113
    language: fr
    extra_args: --max-model-len 2048 --enable-lora --max-lora-rank 64 --lora-modules speech=ibm-granite/granite-speech-3.3-8b
    request_model: speech
    concurrency: 16
  # --- Mistral Voxtral (audio LLM) ------------------------------------------
  - backend: transformers-voxtral
    model: mistralai/Voxtral-Small-24B-2507
    dtype: bfloat16
    language: fr
  # --- MOSS-Transcribe-Diarize ----------------------------------------------
  # No language set: auto-detect is the only documented prompt and the best on
  # French. `language` is an unofficial knob (an English pin makes it translate).
  - backend: moss
    model: OpenMOSS-Team/MOSS-Transcribe-Diarize
    dtype: bfloat16
    batch_size: 8
  # --- Google Gemma 3n (general multimodal LLM, needs timm) -----------------
  - backend: gemma3n
    model: google/gemma-3n-e4b-it
    dtype: bfloat16
  # --- Qwen3-Omni (30B MoE, large VRAM, not ASR-tuned) ----------------------
  - backend: qwen3-omni
    model: Qwen/Qwen3-Omni-30B-A3B-Instruct
    dtype: bfloat16
  # --- Qwen3-ASR (transformers) --------------------------------------------
  - backend: qwen3-asr
    model: Qwen/Qwen3-ASR-1.7B-hf
    dtype: bfloat16
    max_new_tokens: 256
    language: fr
  # --- Microsoft VibeVoice-ASR (9B, transformers port of microsoft/VibeVoice-ASR) --
  # No language setting: auto-detects. Needs transformers >= 5.3.
  - backend: vibevoice-asr
    model: microsoft/VibeVoice-ASR-HF
    dtype: bfloat16
    batch_size: 8
  # --- NVIDIA Nemotron 3.5 ASR (streaming, language-ID prompt, needs NeMo >= 3.0) --
  # Transcribed offline (full utterance), with the French prompt forced. The
  # encoder still masks attention as in streaming: chunk_ms picks the latency
  # (80, 320 = model default, 560, 1120 ms), here the largest one (best WER).
  - backend: nemo
    model: nvidia/nemotron-3.5-asr-streaming-0.6b
    batch_size: 16
    language: fr
    chunk_ms: 1120
  # --- moondream Parakeet Ultra / Redux (post-trainings of parakeet-tdt-0.6b-v3) --
  # transformers ParakeetForTDT (not moondream's Photon runtime, whose CUDA kernels are
  # proprietary): processor/generation config of nvidia/parakeet-tdt-0.6b-v3, redux's
  # ternary encoder unpacked to dense weights at load. No language setting.
  - backend: transformers-parakeet
    model:
    - moondream/parakeet-ultra
    - moondream/parakeet-redux
    batch_size: 16
  # --- NVIDIA canary / parakeet ---------------------------------------------
  # language is required for canary (EncDecMultiTaskModel): the nemo interface
  # passes config["language"] as source_lang/target_lang, no default.
  - backend: nemo
    model:
    - nvidia/canary-180m-flash
    - nvidia/canary-1b
    - nvidia/canary-1b-v2
    - nvidia/parakeet-tdt-0.6b-v3
    batch_size: 16
    language: fr
  # --- fastconformer hybrid, RNNT decoder -----------------------------------
  - backend: nemo
    model:
    - nvidia/stt_fr_fastconformer_hybrid_large_pc
    - bofenghuang/stt_fr_fastconformer_hybrid_large
    - linagora/linto_stt_fr_fastconformer
    - linagora/linto_stt_fr_fastconformer_pc
    batch_size: 16
    decoder:
    - rnnt
  # --- LINTO fastconformer-pc, CTC decoder (RNNT is above) ------------------
  - backend: nemo
    model: linagora/linto_stt_fr_fastconformer_pc
    batch_size: 16
    decoder:
    - ctc
  # --- BuzzASR French (whisper-large-v3 fine-tune, own French tokenizer) -----
  # No language: the prompt is baked into its generation config. Decoding
  # recommended by the model card. transformers-whisper: the ASR pipeline
  # of the `transformers` backend decodes an empty text with its tokenizer.
  - backend: transformers-whisper
    model: BuzzASR/french
    generate_kwargs:
      no_repeat_ngram_size: 3
      repetition_penalty: 1.2
  # --- OpenAI whisper -------------------------------------------------------
  - backend: faster-whisper
    model:
    - large-v3
    - large-v3-turbo
    precision: float16
