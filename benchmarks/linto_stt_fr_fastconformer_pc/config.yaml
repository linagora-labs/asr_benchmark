input_manifest: benchmarks/linto_stt_fr_fastconformer/manifest.jsonl
output_folder: benchmarks/linto_stt_fr_fastconformer_pc/local_bench
input_audios_paths: nemo_dataset/converted_audios/%n_%s
compute_rtf: False
plot_monitoring: False
skip_errors: False
save_alignments: True
save_predictions: False


benchmarks:
  - backend: nemo
    model: 
    - nvidia/canary-180m-flash
    batch_size: 8
  - backend: nemo
    model: 
    - nvidia/stt_fr_fastconformer_hybrid_large_pc
    - bofenghuang/stt_fr_fastconformer_hybrid_large
    - linagora/linto_stt_fr_fastconformer
    - linagora/llinto_stt_fr_fastconformer_pc.nemo
    batch_size: 8
    decoder: 
    - rnnt
  - backend: nemo
    model: linagora/llinto_stt_fr_fastconformer_pc.nemo
    batch_size: 8
    decoder: ctc
  - backend: faster-whisper
    model: 
    - large-v3-turbo
    precision: float16