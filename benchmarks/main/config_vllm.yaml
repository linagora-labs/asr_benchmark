# vLLM benchmark, on the same data as benchmarks/moss/config.yaml so results are
# directly comparable to the transformers/nemo/faster-whisper runs.
#
# Only the audio-LLM models vLLM can serve are here (Voxtral, MOSS, Whisper); NeMo
# canary/fastconformer are CTC/RNNT models and are not vLLM-servable.
#
# Each entry's load() launches `vllm serve <model>` on its port, waits for the
# server's /health, benchmarks it, and cleanup() stops the server before the next
# model -- so the whole file runs in a single pass:
#
#   uv run python benchmarker.py benchmarks/moss/config_vllm.yaml
#
# Requirements:
#   * `vllm` must be on PATH (or set `vllm_command`, e.g. vllm_command: "uvx vllm serve",
#     to run it from a separate environment). The benchmark process itself only needs
#     `requests`, so vLLM does NOT have to be installed in this project's env.
#   * Voxtral additionally needs `mistral-common[audio]` in the vLLM environment.
#   * Set launch: false on an entry to hit a server you started yourself.
#   * PORTS: keep them in the 81xx range. On this DGX Spark, 8003/8005/8008/8010
#     are permanently held by the BeeGFS daemons (beegfs-storage / -meta / -mgmtd),
#     so `vllm serve --port 8005` dies with "OSError: [Errno 98] Address already
#     in use" before it ever loads the model. Check with: ss -lnt '( sport = :PORT )'
#
# Compare with/without vLLM: the same model run via `backend: transformers-voxtral`
# / `backend: moss` / `backend: faster-whisper` (config.yaml) lands in a different
# get_folder_name(), so both appear side by side in the WER/RTF plots.
#
# MEASUREMENT MODES (set per entry with `concurrency`, and globally with compute_rtf):
#   * compute_rtf: True, concurrency 1 (default) -> serial, one file at a time. Per-file
#     latency RTF + hardware monitoring. A single request never batches, so RTF here is
#     roughly the same as the transformers backend (vLLM has no advantage one-at-a-time).
#   * compute_rtf: True, concurrency N (>1) -> CONCURRENT RTF (recommended for vLLM).
#     Keeps N requests in flight so vLLM batches them, AND monitors hardware. Each file
#     gets an amortized throughput-consistent time (rtf = wall/total_audio), so the RTFx
#     in the plot IS the real concurrent throughput; the true per-request latency is kept
#     as 'latency'. This is how you get vLLM's speed AND VRAM in one run.
#   * compute_rtf: False, concurrency N -> throughput only (no monitoring); logs/stores
#     `throughput_rtfx`. Rarely needed now that concurrency works with compute_rtf: True.
# VRAM note: it is measured device-wide (NVML/psutil), so the vLLM SERVER process is
# captured too (it inherits CUDA_VISIBLE_DEVICES). But vLLM pre-reserves VRAM via
# --gpu-memory-utilization (default 0.85; set `gpu_memory_utilization`, or null for
# vLLM's 0.9), so the NVML number reflects that reservation, not the model footprint --
# you can't lower it to ~0.1 (weights must fit + a tiny KV cache kills throughput). For a
# real footprint use the transformers backends (config.yaml) or vLLM's startup log.
input_manifest: benchmarks/linto_stt_fr_fastconformer/manifest.jsonl
output_folder: benchmarks/main/local_bench
input_audios_paths: nemo_dataset/converted_audios/%n_%s
compute_rtf: True
# Concurrent requests in flight (inherited by every entry below). >1 -> concurrent RTF
# mode: throughput + VRAM in one run (see MEASUREMENT MODES above). Set 1 for serial.
concurrency: 8
# Extra env for the `vllm serve` process. MAX_JOBS caps the parallelism of the
# FlashInfer CUTLASS fused-MoE JIT build that MoE models (Qwen3-Omni) trigger at
# startup: unset, ninja runs nproc+2 = 22 nvcc jobs, which OOMs the GB10's unified
# memory next to 59 GiB of resident weights and kills the server with exit -9.
env:
  MAX_JOBS: 4
# Seconds to wait for `vllm serve` to become ready (default 2400). Raised for
# Qwen3-Omni-30B: the checkpoint lives on BeeGFS and vLLM disables auto-prefetch
# there (~8 min just to read the 15 shards), then the FlashInfer CUTLASS fused-MoE
# kernel is JIT-compiled -- and MAX_JOBS: 4 above deliberately makes that build
# slower. Only the first run pays the compile; it is cached in ~/.cache/flashinfer.
startup_timeout: 7200
plot_monitoring: False
skip_errors: False
save_alignments: True
save_predictions: True

benchmarks:
  # --- Mistral Voxtral ------------------------------------------------------
  - backend: vllm
    model: mistralai/Voxtral-Small-24B-2507
    port: 8100
    language: fr

  # --- MOSS-Transcribe-Diarize (custom code -> needs trust_remote_code) ------
  - backend: vllm
    model: OpenMOSS-Team/MOSS-Transcribe-Diarize
    trust_remote_code: true
    port: 8101

  # --- OpenAI Whisper -------------------------------------------------------
  - backend: vllm
    model: openai/whisper-large-v3
    port: 8102
    language: fr

  # --- Mistral Voxtral realtime --------------------------------------------
  - backend: vllm
    model: mistralai/Voxtral-Mini-4B-Realtime-2602
    port: 8103
    language: fr

  # --- Google Gemma 3n ------------------------------------------------------
  - backend: vllm
    model: google/gemma-3n-e4b-it
    port: 8104
    language: fr

  # --- Qwen3-Omni (large; may need trust_remote_code) -----------------------
  - backend: vllm
    model: Qwen/Qwen3-Omni-30B-A3B-Instruct
    port: 8105
    language: fr

  # --- Mistral Voxtral realtime -- DISABLED, see below ----------------------
  # DO NOT re-enable over this backend. Voxtral-Mini-4B-Realtime is a STREAMING
  # model: vLLM serves it on the WebSocket ws://host:port/v1/realtime (OpenAI
  # Realtime protocol -- session.update, input_audio_buffer.append/.commit). The
  # generic /v1/audio/transcriptions route this backend POSTs to is still
  # registered, so the request is ACCEPTED, but the realtime model never receives
  # its audio through it: embed_input_ids() gets multimodal_embeddings=None and
  # substitutes zeros (voxtral_realtime.py:304, "Returning zero embeddings to
  # avoid engine crash"). The LM then decodes from silence and never emits an EOS,
  # so every request runs until request_timeout with no usable transcript --
  # the benchmark HANGS instead of failing. Benchmarking it needs a websocket
  # client backend (cf. interfaces_lintostt.py); until then use the transformers
  # path, backend: transformers-voxtral-realtime (already in config.yaml).
  # - backend: vllm
  # model: mistralai/Voxtral-Mini-4B-Realtime-2602
  # port: 8103
  # language: fr
  # # vLLM defaults cudagraph_mode to FULL_AND_PIECEWISE, and this model asserts
  # # "Voxtral realtime doesn't support full cudagraphs yet. Please use PIECEWISE."
  # # (voxtral_realtime.py:221) -> engine init fails before any weight is loaded.
  # # NB: extra_args must stay a STRING here. make_configs() expands every
  # # list-valued field into a Cartesian product, so a YAML list would be read as
  # # several separate benchmark runs, one per flag. The string is split on
  # # whitespace, hence the space-free JSON.
  # extra_args: '--compilation-config {"cudagraph_mode":"PIECEWISE"}'
