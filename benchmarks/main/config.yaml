# WER benchmark for MOSS-Transcribe-Diarize, on the same data as the
# linto_stt_fr_fastconformer benchmark so results are directly comparable.
#
# The baselines below are the 7 models of the WER table published with
# linagora/linto_stt_fr_fastconformer_pc:
#   https://huggingface.co/linagora/linto_stt_fr_fastconformer_pc/blob/main/assets/wer_table.png
#
# IMPORTANT -- this file CANNOT be run in a single pass. The moss, nemo and
# whisper extras are declared as mutually conflicting in pyproject.toml (moss
# needs transformers 5.x), so each backend needs its own environment. Run the
# three passes below in turn; every model writes its own subfolder under the
# shared output_folder, so the results end up side by side either way:
#
#   uv run --extra moss    python benchmarker.py benchmarks/moss/config.yaml
#   uv run --extra nemo    python benchmarker.py benchmarks/moss/config.yaml
#   uv run --extra whisper python benchmarker.py benchmarks/moss/config.yaml
#
# Already-benched models are skipped by check_if_benched, so each pass only
# runs the backend it has the dependencies for -- but keep skip_errors: False
# in mind: a pass aborts when it reaches a backend it cannot import, so put the
# backend you want first, or set skip_errors: True to sweep through all three.
input_manifest: benchmarks/linto_stt_fr_fastconformer/manifest.jsonl
output_folder: benchmarks/main/local_bench
input_audios_paths: nemo_dataset/converted_audios/%n_%s
compute_rtf: True
plot_monitoring: False
skip_errors: False
save_alignments: True
save_predictions: True

benchmarks:
  # --- the model under test -------------------------------------------------
  # MOSS baseline = auto-detect (language unset -> None), which is the ONLY prompt
  # documented by the model and the best-performing on French. `language` is an
  # UNOFFICIAL knob: MOSS has no documented way to force a language. Pinning via an
  # English prompt makes it translate French->English (big regression on VoxPopuli/
  # YouTube); the code instead pins via an untested Chinese prompt. To experiment,
  # add e.g. `language: fr` -- but treat the auto-detect run as the real baseline.
  - backend: moss
    model: OpenMOSS-Team/MOSS-Transcribe-Diarize
    dtype: bfloat16

  # --- Mistral Voxtral (audio LLM, same transformers 5.x env as moss) -------
  - backend: transformers-voxtral
    model: mistralai/Voxtral-Small-24B-2507
    dtype: bfloat16
    language: fr

  # --- Mistral Voxtral realtime -- DISABLED in this (transformers) config ----
  # Voxtral-Mini-Realtime is a STREAMING model: it signals end-of-turn via a
  # streaming end-of-audio mechanism, not a text EOS in one-shot generate(). Run
  # through the transformers backend it therefore never stops early and burns the
  # full max_tokens (512) per clip -> ~45 s for a 5 s CommonVoice utterance
  # (RTF ~9x), making it impractically slow here. The model card recommends vLLM
  # streaming (websockets); benchmark it via benchmarks/main/config_vllm.yaml
  # instead, where it is kept.
  # - backend: transformers-voxtral-realtime
  #   model: mistralai/Voxtral-Mini-4B-Realtime-2602
  #   dtype: bfloat16

  # --- Google Gemma 3n (general multimodal LLM; may need `timm` installed) ----
  - backend: gemma3n
    model: google/gemma-3n-e4b-it
    dtype: bfloat16

  # --- Qwen3-Omni (30B MoE thinker, text output; large VRAM, not ASR-tuned) --
  # For pure ASR, Qwen/Qwen3-ASR-1.7B-hf would be a lighter, better-suited model.
  - backend: qwen3-omni
    model: Qwen/Qwen3-Omni-30B-A3B-Instruct
    dtype: bfloat16

  # --- baselines: OPENAI ----------------------------------------------------
  - backend: faster-whisper
    model: large-v3-turbo
    precision: float16

  # --- baselines: NVIDIA canary --------------------------------------------
  # language is required here: the nemo interface passes config["language"] as
  # source_lang/target_lang for EncDecMultiTaskModel (canary), and the default
  # in interfaces.py is commented out, so omitting it raises KeyError.
  - backend: nemo
    model:
    - nvidia/canary-180m-flash
    - nvidia/canary-1b-v2
    batch_size: 8
    language: fr

  # --- baselines: fastconformer hybrid, RNNT decoder ------------------------
  - backend: nemo
    model:
    - nvidia/stt_fr_fastconformer_hybrid_large_pc
    - bofenghuang/stt_fr_fastconformer_hybrid_large
    - linagora/linto_stt_fr_fastconformer
    batch_size: 8
    decoder:
    - rnnt

  # --- baselines: LINTO fastconformer-pc, both decoders ---------------------
  - backend: nemo
    model: linagora/linto_stt_fr_fastconformer_pc
    batch_size: 8
    decoder:
    - rnnt
    - ctc
