# FLEURS (en, nl, it, de, es, pt, ar), Multilingual TEDx (it, de, es, pt, ar), VoxPopuli (en, nl), test sets
# (segments of 30 s at most), and 10% of CommonVoice en: 3 test sets in English, 2 in the other languages.
# Manifests: python tools/build_manifests.py --benchmark sota_multilingual
# On the DGX: tools/run_sota_dgx.sh PART -c benchmarks/sota_multilingual/config.yaml
# Each dataset has its `language`: the model switches to it (language, and `prompts` of the
# entry) before transcribing the dataset, without being reloaded, and the scoring uses it
# (text normalization of ssak). `languages` (per
# entry): only the datasets of these languages, for the models that do not support them all.
min_duration: 1  # as in benchmarks/sota: shorter segments are not representative
max_duration: 30  # as in benchmarks/sota: some models take at most 30 s
datasets:
  FLEURS_en:
    manifest: benchmarks/sota_multilingual/manifests/FLEURS_en.jsonl
    language: en
  Voxpopuli_en:
    manifest: benchmarks/sota_multilingual/manifests/Voxpopuli_en.jsonl
    language: en
  CommonVoice_en:  # Common Voice 22.0, 16k segments
    manifest: benchmarks/sota_multilingual/manifests/CommonVoice_en.jsonl
    language: en
    ratio: 0.1
  FLEURS_nl:
    manifest: benchmarks/sota_multilingual/manifests/FLEURS_nl.jsonl
    language: nl
  Voxpopuli_nl:
    manifest: benchmarks/sota_multilingual/manifests/Voxpopuli_nl.jsonl
    language: nl
  FLEURS_it:
    manifest: benchmarks/sota_multilingual/manifests/FLEURS_it.jsonl
    language: it
  TEDX_it:
    manifest: benchmarks/sota_multilingual/manifests/TEDX_it.jsonl
    language: it
  FLEURS_de:
    manifest: benchmarks/sota_multilingual/manifests/FLEURS_de.jsonl
    language: de
  TEDX_de:
    manifest: benchmarks/sota_multilingual/manifests/TEDX_de.jsonl
    language: de
  FLEURS_es:
    manifest: benchmarks/sota_multilingual/manifests/FLEURS_es.jsonl
    language: es
  TEDX_es:
    manifest: benchmarks/sota_multilingual/manifests/TEDX_es.jsonl
    language: es
  FLEURS_pt:
    manifest: benchmarks/sota_multilingual/manifests/FLEURS_pt.jsonl
    language: pt
  TEDX_pt:
    manifest: benchmarks/sota_multilingual/manifests/TEDX_pt.jsonl
    language: pt
  FLEURS_ar:
    manifest: benchmarks/sota_multilingual/manifests/FLEURS_ar.jsonl
    language: ar
  TEDX_ar:
    manifest: benchmarks/sota_multilingual/manifests/TEDX_ar.jsonl
    language: ar
output_folder: benchmarks/sota_multilingual/results
compute_rtf: False
plot_monitoring: False
skip_errors: False
save_alignments: True
save_predictions: False

benchmarks:
  # Part salm
  - backend: vllm
    model: OpenLLM-France/Luciole-1B-Audio-1.0
    port: 8111
    endpoint: chat
    audio_placeholder: "<|audio|>"
    # The card's French prompt, with the language
    prompts: &luciole_prompts
      en: "Fais une transcription mot pour mot en anglais du contenu parlé."
      nl: "Fais une transcription mot pour mot en néerlandais du contenu parlé."
      it: "Fais une transcription mot pour mot en italien du contenu parlé."
      de: "Fais une transcription mot pour mot en allemand du contenu parlé."
      es: "Fais une transcription mot pour mot en espagnol du contenu parlé."
      pt: "Fais une transcription mot pour mot en portugais du contenu parlé."
      ar: "Fais une transcription mot pour mot en arabe du contenu parlé."
  - backend: vllm
    model: OpenLLM-France/Luciole-8B-Audio-1.0
    port: 8112
    endpoint: chat
    audio_placeholder: "<|audio|>"
    prompts: *luciole_prompts
  - backend: vllm
    model: OpenLLM-France/Luciole-23B-Audio-1.0
    port: 8117
    endpoint: chat
    audio_placeholder: "<|audio|>"
    prompts: *luciole_prompts
    concurrency: 32
  # Part vllm
  - backend: vllm
    model: mistralai/Voxtral-Mini-3B-2507
    port: 8116
    # Voxtral (offline), Canary-1b-v2 / Parakeet-tdt-0.6b-v3 (25 European languages): no Arabic
    languages: &european [en, nl, it, de, es, pt]
  - backend: vllm
    model: Qwen/Qwen3-ASR-1.7B
    port: 8106
  # As in benchmarks/sota: the chat template ignores the text prompt, the language is forced by
  # chat_template_kwargs (English name, Qwen3-ASR format)
  - backend: vllm
    model: Reson8/Rumble-2-Flash
    port: 8121
    endpoint: chat
    extra_args: --max-model-len 4096
    # Run next to a Luciole chat demo (0.2) on dgx2
    gpu_memory_utilization: 0.3
    extra_bodies:
      en: {chat_template_kwargs: {language: English}}
      nl: {chat_template_kwargs: {language: Dutch}}
      it: {chat_template_kwargs: {language: Italian}}
      de: {chat_template_kwargs: {language: German}}
      es: {chat_template_kwargs: {language: Spanish}}
      pt: {chat_template_kwargs: {language: Portuguese}}
      ar: {chat_template_kwargs: {language: Arabic}}
  # The card's language-ID and punctuated-ASR prompts (benchmarks/sota: same in French). ASR in
  # en, fr, de, es, pt, ja only
  - backend: vllm
    model: ibm-granite/granite-speech-5.0-2b
    served_model_name: ibm-granite/granite-speech-5.0-2b
    port: 8122
    endpoint: chat
    extra_args: --max-model-len 2048
    concurrency: 128
    languages: [en, de, es, pt]
    prompts:
      en: "<|audio|>The speech is in English. Transcribe it exactly; do not translate. transcribe the speech with proper punctuation and capitalization."
      de: "<|audio|>The speech is in German. Transcribe it exactly; do not translate. transcribe the speech with proper punctuation and capitalization."
      es: "<|audio|>The speech is in Spanish. Transcribe it exactly; do not translate. transcribe the speech with proper punctuation and capitalization."
      pt: "<|audio|>The speech is in Portuguese. Transcribe it exactly; do not translate. transcribe the speech with proper punctuation and capitalization."
  - backend: vllm
    model: CohereLabs/cohere-transcribe-03-2026
    trust_remote_code: true
    port: 8115
  # Needs vLLM >= 0.31, server started apart: tools/serve_salm_nvcr_dgx.sh MODEL 8118 EXTRA_ARGS
  # --trust-remote-code, then the benchmark with --force
  - backend: vllm
    model: nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B
    launch: false
    server: http://172.17.0.1
    port: 8118
    endpoint: chat
    # benchmarks/sota prompt (card format), with the language of the test set
    prompts:
      en: "Audio transcription. Language: English. Wording: verbatim, including fillers and repetitions. Formatting: punctuation and capitalization. Output: transcript only."
      nl: "Audio transcription. Language: Dutch. Wording: verbatim, including fillers and repetitions. Formatting: punctuation and capitalization. Output: transcript only."
      it: "Audio transcription. Language: Italian. Wording: verbatim, including fillers and repetitions. Formatting: punctuation and capitalization. Output: transcript only."
      de: "Audio transcription. Language: German. Wording: verbatim, including fillers and repetitions. Formatting: punctuation and capitalization. Output: transcript only."
      es: "Audio transcription. Language: Spanish. Wording: verbatim, including fillers and repetitions. Formatting: punctuation and capitalization. Output: transcript only."
      pt: "Audio transcription. Language: Portuguese. Wording: verbatim, including fillers and repetitions. Formatting: punctuation and capitalization. Output: transcript only."
      ar: "Audio transcription. Language: Arabic. Wording: verbatim, including fillers and repetitions. Formatting: punctuation and capitalization. Output: transcript only."
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
    concurrency: 32
    trust_remote_code: true
    extra_args: --max-model-len 8192 --enable-chunked-prefill --no-enable-prefix-caching --mamba-cache-mode none --mm-processor-cache-gb 0 --speculative-config {"method":"mtp","num_speculative_tokens":2} --gpu-memory-utilization 0.6
  - backend: vllm
    model: Qwen/Qwen3-Omni-30B-A3B-Instruct
    port: 8105
    startup_timeout: 7200
    env:
      MAX_JOBS: 4
  - backend: vllm
    model: Qwen/Qwen3-ASR-0.6B
    port: 8119
    concurrency: 128
  # Crashed dgx2 (2026-11-18, concurrency 32, gpu_memory_utilization 0.6, during CommonVoice_en),
  # passed (2026-11-23) with concurrency 16, 0.5. Concurrency 64 crashes the DGX Spark.
  - backend: vllm
    model: mistralai/Voxtral-Small-24B-2507
    port: 8101
    concurrency: 16
    gpu_memory_utilization: 0.5
    languages: *european
  # Part transformers4. Detects the language
  - backend: hojo-asr
    model: HojoAI/Hojo-ASR-Multi-V1
    batch_size: 16
    languages: [en, it, de, es, pt]  # en: not on the card, run on request
  # Part transformers. Detect the language. Batches of 64: conv2d over 2^31 elements on Voxpopuli_en
  - backend: transformers-parakeet
    model:
    - moondream/parakeet-ultra
    - moondream/parakeet-redux
    batch_size: 16
    languages: *european
  # One fine-tune per language (language baked in its tokenizer), not through vLLM (garbage)
  - backend: transformers-whisper
    model: BuzzASR/english
    batch_size: 64
    generate_kwargs: &buzz_generate {no_repeat_ngram_size: 3, repetition_penalty: 1.2}
    languages: [en]
  - backend: transformers-whisper
    model: BuzzASR/dutch
    batch_size: 64
    generate_kwargs: *buzz_generate
    languages: [nl]
  - backend: transformers-whisper
    model: BuzzASR/italian
    batch_size: 64
    generate_kwargs: *buzz_generate
    languages: [it]
  - backend: transformers-whisper
    model: BuzzASR/german
    batch_size: 64
    generate_kwargs: *buzz_generate
    languages: [de]
  - backend: transformers-whisper
    model: BuzzASR/spanish
    batch_size: 64
    generate_kwargs: *buzz_generate
    languages: [es]
  - backend: transformers-whisper
    model: BuzzASR/portuguese
    batch_size: 64
    generate_kwargs: *buzz_generate
    languages: [pt]
  - backend: transformers-whisper
    model: BuzzASR/arabic
    batch_size: 64
    generate_kwargs: *buzz_generate
    languages: [ar]
  # Part nemo
  - backend: nemo
    model:
    - nvidia/canary-1b-v2
    - nvidia/parakeet-tdt-0.6b-v3
    batch_size: 64
    languages: *european
  # Part whisper
  - backend: faster-whisper
    model:
    - large-v3
    - large-v3-turbo
    precision: float16
